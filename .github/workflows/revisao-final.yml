name: Publicar revisao final da proposta
on:
  push:
    paths:
      - '.github/workflows/revisao-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar dependencia
        run: python -m pip install --quiet beautifulsoup4
      - name: Aplicar a revisao no HTML atual
        run: python scripts/revisar_proposta.py
      - name: Gravar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Revisao final da proposta O Novo Jardins"
            git push origin HEAD:main
          fi
